<style>
/* Tata letak: aplikasi satu kolom, lima langkah (bar atas dengan kemajuan, kartu isian, bar bawah dengan tombol Kembali / Lanjut). */
:root{
  --bg:#eef2f1; --surface:#ffffff; --fg:#14211d; --muted:#586862; --line:#d2dbd8;
  --accent:#0d6b5b; --accent-fg:#ffffff; --accent-soft:#dff0ec; --gold:#f2b705;
  --danger:#b3261e; --danger-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fff3d6; --ok:#17794a; --ok-soft:#e1f4e9;
  --paper:#ffffff; --ink:#000000; --shadow:0 1px 2px rgba(20,33,29,.08),0 8px 24px rgba(20,33,29,.08);
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-doc:Tinos,"Times New Roman",Times,serif; --f-kop:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#17211e; --fg:#e6eeeb; --muted:#9bafa7; --line:#2b3a35;
  --accent:#4fc3a8; --accent-fg:#06241d; --accent-soft:#1d3a33;
  --danger:#ff8a80; --danger-soft:#3a1f1c; --warn:#ffd277; --warn-soft:#3a2f12; --ok:#6fdc9f; --ok-soft:#173326;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.app{position:sticky;top:0;z-index:30;background:var(--accent);color:var(--accent-fg);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.app-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-bottom:10px}
.app img{width:34px;height:auto;border-radius:3px;background:#fff;padding:2px;flex:none}
.app .ttl{font-weight:700;font-size:17px;line-height:1.2}
.app .sub{font-size:13px;opacity:.92}
.prog{height:4px;background:rgba(255,255,255,.28);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.prog i{display:block;height:100%;background:var(--gold);width:20%;transition:width .25s}
main{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.steps{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.steps li{flex:1;min-width:0}
.steps button{width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.steps .dot{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps .lbl{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.done .dot{background:var(--accent)} .steps li.cur .dot{background:var(--accent)}
.steps li.cur .lbl{color:var(--fg);font-weight:700}
.steps li.todo button{cursor:default}
@media(max-width:520px){.steps .lbl{display:none}.steps li.cur .lbl{display:block;position:absolute;opacity:0}}
h1{font-size:24px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 4px}
.card .help{margin:0 0 14px;color:var(--muted);font-size:14px}
.f{margin-bottom:16px;min-width:0}.f:last-child{margin-bottom:0}
label.l{display:block;font-weight:600;margin-bottom:6px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:48px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0}
textarea{resize:vertical;min-height:88px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.bad{border-color:var(--danger)!important;background:var(--danger-soft)!important}
.err{color:var(--danger);font-size:14px;margin-top:5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.two.keep{grid-template-columns:1fr 1fr}.two:not(.keep){grid-template-columns:1fr}}
.rowline{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rowline input{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:disabled{opacity:.65;cursor:progress}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.x{flex:none;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
.mcard{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--bg)}
.mcard .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.info{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer;font-size:17px;line-height:1;padding:0}
.file{position:relative;display:inline-flex}
.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file:focus-within>span{outline:3px solid var(--accent);outline-offset:1px}
.status{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
.status.err2{color:var(--danger);font-weight:600}
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:0}
.badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.no{background:var(--danger-soft);color:var(--danger)}
.check .t{font-weight:600}.check .d{font-size:14px;color:var(--muted)}
.check .go{margin-left:auto;flex:none}
.pvbox{background:var(--line);border-radius:12px;padding:10px;overflow:hidden}
.scaler{position:relative;margin:0 auto}
.stage{width:794px;transform-origin:0 0;display:flex;flex-direction:column;gap:16px}
.result{border:1.5px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:16px;margin-bottom:16px}
.result strong{display:block;font-size:17px;margin-bottom:4px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:720px;margin:0 auto;display:flex;gap:12px}
.dock .btn{flex:1}.dock .btn.back{flex:0 0 36%}
.dock .btn[hidden]{display:none}
details.opt{margin-top:4px}details.opt summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:44px;display:flex;align-items:center}
.save{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 16px}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Kertas A4 (794 x 1123 px). Tetap putih di tema gelap karena ini dokumen yang dicetak. */
.pg{width:794px;min-height:1123px;background:var(--paper);color:var(--ink);font-family:var(--f-doc);font-size:15px;line-height:1.35;padding:52px 66px 56px;position:relative;box-shadow:var(--shadow)}
.export-host{position:absolute;left:-10000px;top:0;width:794px}
.export-host .pg{box-shadow:none}
.kop{position:relative;text-align:center;min-height:92px;padding:0 0 4px}
.kop img{position:absolute;left:0;top:0;width:78px;height:auto}
.kop .k1{font-family:var(--f-kop);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1.15}
.kop .k2{font-family:var(--f-kop);font-weight:700;font-size:23px;letter-spacing:.02em;line-height:1.2}
.kop .k3{font-size:14px;margin-top:2px}
.rule{border-top:4px solid var(--ink);border-bottom:1.5px solid var(--ink);height:7px;margin:6px 0 20px}
.jd{text-align:center;font-size:15px;text-decoration:underline;font-weight:700;margin:0 0 18px;letter-spacing:.01em}
table.kv{border-collapse:collapse;width:100%}
table.kv td{vertical-align:top;padding:5px 0}
table.kv td.l{width:152px}table.kv td.c{width:16px;text-align:center}
table.hk{border-collapse:collapse;width:100%;margin:1px 0}
table.hk th,table.hk td{border:1px solid var(--ink);text-align:center;padding:3px 6px;font-weight:400}
.pre{white-space:pre-wrap}
.sign{width:300px;margin:34px 0 0 230px;text-align:center}
.sign .nm{margin-top:62px;text-decoration:underline;min-height:1.35em}
.dh{text-align:center;font-weight:700;text-decoration:underline;font-size:15px;margin:0 0 14px}
.ph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ph{height:300px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.ph img{display:block;max-width:none;max-height:none;flex:none}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

<script>

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return (n<10?"0":"")+n}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function tgl(v){if(!v)return"";var p=v.split("-");if(p.length<3)return"";return (+p[2])+" "+BULAN[+p[1]-1]+" "+p[0]}
function newRow(b){return {id:++uid,bulan:b||"",sasaran:"",kunjungan:"",photos:[]}}
function freshActivity(S){

  S.evaluasi="";S.tglLaporan=todayISO();S.rows=[newRow("")];
}
function blank(){

  freshActivity(S);return S;
}

try{

      j.rows=j.rows.map(function(r){return {id:++uid,bulan:r.bulan||"",sasaran:r.sasaran||"",kunjungan:r.kunjungan||"",photos:[]}});

      if(!Array.isArray(j.kader)||!j.kader.length)j.kader=[""];
      S=Object.assign(blank(),j);
      restored=!!(S.posyandu||S.kelurahan);
    }}
}catch(e){}
function save(){
  try{var c=JSON.parse(JSON.stringify(S));c.rows=S.rows.map(function(r){return {bulan:r.bulan,sasaran:r.sasaran,kunjungan:r.kunjungan}});localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}
}

/* ---------- validasi dan ringkasan ---------- */
function kaderList(){return S.kader.map(function(s){return s.trim()}).filter(Boolean)}
function rowsOk(){return S.rows.filter(function(r){return r.bulan&&r.sasaran!==""&&r.kunjungan!==""})}
function photoCount(){return S.rows.reduce(function(n,r){return n+r.photos.length},0)}
function validate(i){
  var e=[];
  if(i===0){
    if(!S.kelurahan)e.push({id:"kelurahan",m:"Pilih kelurahan."});
    if(!S.posyandu.trim())e.push({id:"posyandu",m:"Isi nama posyandu."});
    if(!kaderList().length)e.push({id:"kader0",m:"Isi minimal satu nama kader."});
  }
  if(i===1){
    if(!S.tanggal)e.push({id:"tanggal",m:"Pilih tanggal kegiatan."});
    var any=false;
    S.rows.forEach(function(r){
      var started=r.bulan||r.sasaran!==""||r.kunjungan!=="";
      if(started){any=true;
        if(!r.bulan)e.push({id:"b"+r.id,m:"Pilih bulan."});
        if(r.sasaran==="")e.push({id:"s"+r.id,m:"Isi sasaran lansia."});
        if(r.kunjungan==="")e.push({id:"k"+r.id,m:"Isi kunjungan lansia."});
      }});
    if(!any)e.push({id:"b"+S.rows[0].id,m:"Isi minimal satu bulan kegiatan."});
  }
  return e;
}
function showErrors(list){
  main.querySelectorAll(".err").forEach(function(n){n.remove()});
  main.querySelectorAll(".bad").forEach(function(n){n.classList.remove("bad")});
  list.forEach(function(x){
    var el=document.getElementById(x.id);if(!el)return;
    el.classList.add("bad");el.setAttribute("aria-invalid","true");
    var d=document.createElement("div");d.className="err";d.textContent=x.m;
    var anchor=el.closest(".rowline")||el;anchor.insertAdjacentElement("afterend",d);
  });
  if(list.length){var f=document.getElementById(list[0].id);if(f){f.scrollIntoView({block:"center",behavior:"smooth"});try{f.focus({preventScroll:true})}catch(e){}}}
}

function stepper(){
  return '<ol class="steps" aria-label="Langkah">'+STEPS.map(function(t,i){
    var c=i<step?"done":(i===step?"cur":"todo");
    return '<li class="'+c+'"><button type="button" data-goto="'+i+'"'+(i>step?' tabindex="-1" aria-disabled="true"':'')+(i===step?' aria-current="step"':'')+'><span class="dot"></span><span class="lbl">'+(i+1)+'. '+t+'</span></button></li>';
  }).join("")+'</ol>';
}
function opt(list,sel,ph){return '<option value="">'+ph+'</option>'+list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join("")}

function viewPeriksa(){
  var kl=kaderList(), ok=rowsOk(), ph=photoCount();
  var items=[
    checkItem(S.posyandu.trim()&&S.kelurahan?"ok":"no","Posyandu",S.posyandu.trim()?esc(S.posyandu)+", Kelurahan "+esc(S.kelurahan||"-"):"Belum diisi",0),

  ].join("");
  var missing=!(S.posyandu.trim()&&S.kelurahan&&kl.length&&S.tanggal&&ok.length);
  return '<h1>Periksa dan download</h1><p class="lead">Pastikan semua benar, lalu buat PDF untuk dicetak.</p>'+
  '<section class="card"><ul class="check">'+items+'</ul></section>'+
  '<div id="result"></div>'+
  '<button type="button" class="btn primary block" id="make"'+(missing?' disabled':'')+'>Buat PDF laporan</button>'+
  '<div class="status" id="makest" role="status" aria-live="polite">'+(missing?"Lengkapi bagian bertanda × terlebih dahulu.":"")+'</div>'+
  '<h2 style="margin:24px 0 10px;font-size:17px">Pratinjau surat</h2><div class="pvbox" id="pvbox"><div class="scaler" id="scaler"><div class="stage" id="stage"></div></div></div>';
}
var VIEWS=[viewPosyandu,viewKegiatan,viewFoto,viewCatatan,viewPeriksa];

function render(keepScroll){
  main.innerHTML=stepper()+VIEWS[step]();
  document.getElementById("stepsub").textContent="Langkah "+(step+1)+" dari 5 · "+STEPS[step];
  document.getElementById("progbar").style.width=((step+1)*20)+"%";
  btnBack.hidden=step===0;
  btnNext.hidden=step===4;
  btnNext.textContent=step===3?"Periksa laporan ›":"Lanjut ›";
  if(step===4)renderPreview();
  if(!keepScroll){window.scrollTo(0,0);try{main.focus({preventScroll:true})}catch(e){}}
}
function go(n){step=Math.max(0,Math.min(4,n));render()}

/* ---------- interaksi ---------- */

  if(t.dataset.k){S[t.dataset.k]=t.value;save()}
  else if(t.dataset.kader!=null){S.kader[+t.dataset.kader]=t.value;save()}

var wipeArm=0;
main.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;

  if(b.dataset.delrow){S.rows=S.rows.filter(function(r){return r.id!=b.dataset.delrow});save();render(true);return}
  if(b.id==="add-row"){var last=S.rows.map(function(r){return r.bulan}).filter(Boolean).pop();var nr=newRow(last?BULAN[(BULAN.indexOf(last)+1)%12]:"");S.rows.push(nr);save();render(true);var el2=document.getElementById("s"+nr.id);if(el2)el2.scrollIntoView({block:"center"});return}
  if(b.dataset.rm){var p=b.dataset.rm.split(":");rowById(p[0]).photos.splice(+p[1],1);render(true);return}
  if(b.id==="new-report"){var keep={kelurahan:S.kelurahan,alamat:S.alamat,posyandu:S.posyandu,kader:S.kader.slice(),dasar:S.dasar,lurah:S.lurah,nip:S.nip,kota:S.kota};S=Object.assign(blank(),keep);restored=false;save();go(1);return}
  if(b.id==="wipe"){
    if(!wipeArm){wipeArm=1;b.textContent="Ketuk lagi untuk menghapus semua";setTimeout(function(){wipeArm=0;if(b.isConnected)b.textContent="Hapus semua isian"},4000);return}
    wipeArm=0;S=blank();restored=false;save();render();return}
  if(b.id==="make"){makePdf(b)}
});
btnBack.addEventListener("click",function(){go(step-1)});
btnNext.addEventListener("click",function(){
  var e=validate(step);
  if(e.length){showErrors(e);return}
  go(step+1);
});
function rowById(id){return S.rows.filter(function(r){return r.id==id})[0]}

/* ---------- foto ---------- */
function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error("baca"))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error("format"))};
      im.onload=function(){
        var m=1400,w=im.naturalWidth,h=im.naturalHeight;
        if(!w||!h){rej(new Error("format"));return}
        var s=Math.min(1,m/Math.max(w,h)),c=document.createElement("canvas");
        c.width=Math.round(w*s);c.height=Math.round(h*s);
        var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        res({s:c.toDataURL("image/jpeg",0.85),w:c.width,h:c.height});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function addPhotos(id,files){
  var r=rowById(id),list=Array.prototype.slice.call(files||[]),room=MAXFOTO-r.photos.length;
  var st=main.querySelector('[data-st="'+id+'"]');
  function say(t,bad){if(st){st.textContent=t;st.className="status"+(bad?" err2":"")}}
  if(room<=0){say("Sudah ada "+MAXFOTO+" foto untuk bulan ini.",true);return}
  var skipped=list.length>room;list=list.slice(0,room);
  say("Memproses foto…");
  Promise.all(list.map(function(f){return shrink(f).catch(function(){return null})})).then(function(arr){
    var ok=arr.filter(Boolean);ok.forEach(function(p){r.photos.push(p)});
    var bad=arr.length-ok.length;
    if(step===2){render(true);var st2=main.querySelector('[data-st="'+id+'"]');
      if(st2){st2.textContent=bad?bad+" foto tidak bisa dibaca. Gunakan foto JPG atau PNG.":(skipped?"Hanya "+MAXFOTO+" foto pertama yang dipakai.":ok.length+" foto ditambahkan.");st2.className="status"+((bad||skipped)?" err2":"")}}
  });
}

/* ---------- dokumen ---------- */
function pagesHtml(){
  var kel=(S.kelurahan||"").toUpperCase(),pos=(S.posyandu||"").trim();
  var kader=kaderList().map(function(n){return "- "+esc(n)}).join("<br>");
  var tempat=(S.tempat||"").trim()||(pos?"Posyandu "+pos:"");
  var rows=rowsOk();
  var hasil=rows.length?'<table class="hk"><tr><th>Bulan</th><th>Sasaran lansia</th><th>Kunjungan Lansia</th></tr>'+
    rows.map(function(r){return '<tr><td>'+esc(r.bulan)+'</td><td>'+esc(r.sasaran)+'</td><td>'+esc(r.kunjungan)+'</td></tr>'}).join("")+'</table>':"";
  function kv(l,v,raw){return '<tr><td class="l">'+l+'</td><td class="c">:</td><td>'+(raw?v:esc(v))+'</td></tr>'}
  function pre(v){return '<span class="pre">'+esc(v)+'</span>'}
  var p1='<section class="pg"><div class="kop"><img src="'+LOGO+'" alt="">'+
    '<div class="k1">PEMERINTAH KOTA PALU</div><div class="k2">KECAMATAN PALU UTARA</div><div class="k2">KELURAHAN '+esc(kel)+'</div>'+
    (S.alamat?'<div class="k3">'+esc(S.alamat)+'</div>':'')+'</div><div class="rule"></div>'+
    '<h2 class="jd">LAPORAN POSYANDU LANJUT USIA</h2><table class="kv">'+
    kv("Dasar Penugasan",S.dasar)+kv("Nama Posyandu",pos)+kv("Nama Kader",kader,true)+
    kv("Tanggal &amp; Bulan Kegiatan",S.tanggal?"Tanggal : "+tgl(S.tanggal):"")+
    kv("Tempat Kegiatan",tempat)+
    kv("Tujuan Kegiatan","Mewujudkan Lansia yang sehat & Mandiri di Wilayah Kerja Posyandu KELURAHAN "+kel)+
    kv("Sasaran Kegiatan",pos?"Seluruh masyarakat di wilayah kerja Posyandu "+pos+", khususnya lansia.":"")+
    kv("Hasil Kegiatan",hasil,true)+kv("Masalah di Temukan",pre(S.masalah),true)+kv("Penyelesaian Masalah",pre(S.selesai),true)+
    kv("Tindak Lanjut",pre(S.tindak),true)+kv("Evaluasi",pre(S.evaluasi),true)+
    '</table><div class="sign"><div>'+esc((S.kota||"").trim())+(S.tglLaporan?", "+tgl(S.tglLaporan):"")+'</div><div>Mengetahui</div><div>LURAH</div>'+
    '<div class="nm">'+esc(S.lurah)+'</div><div>'+esc(S.nip)+'</div></div></section>';
  var out=[p1];
  S.rows.forEach(function(r){
    if(!r.photos.length)return;
    var title="DOKUMENTASI KEGIATAN"+(r.bulan?" "+r.bulan.toUpperCase():"");
    for(var i=0;i<r.photos.length;i+=6){
      var cells=r.photos.slice(i,i+6).map(function(p){
        var k=Math.min(325/p.w,300/p.h),w=Math.round(p.w*k),h=Math.round(p.h*k);
        return '<div class="ph"><img src="'+p.s+'" alt="" width="'+w+'" height="'+h+'" style="width:'+w+'px;height:'+h+'px"></div>';
      }).join("");
      out.push('<section class="pg"><div class="dh">'+esc(title)+'</div><div class="ph-grid">'+cells+'</div></section>');
    }
  });
  return out.join("");
}
var ro=null;
function fit(){
  var box=document.getElementById("pvbox"),stage=document.getElementById("stage"),sc=document.getElementById("scaler");
  if(!box||!stage||!sc)return;
  var w=box.clientWidth-20,s=Math.min(1,w/794);if(w<=0)return;
  stage.style.transform="scale("+s+")";
  sc.style.width=Math.ceil(794*s)+"px";sc.style.height=Math.ceil(stage.offsetHeight*s)+"px";
}
function renderPreview(){
  var stage=document.getElementById("stage");if(!stage)return;
  stage.innerHTML=pagesHtml();fit();
  if(ro)ro.disconnect();
  if(window.ResizeObserver){ro=new ResizeObserver(fit);ro.observe(document.getElementById("pvbox"))}
}
window.addEventListener("resize",fit);

/* ---------- PDF ---------- */
var resUrl=null,resBlob=null,resName="";
async function buildPdf(){
  if(!window.html2canvas||!window.jspdf)throw new Error("lib");
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  var host=document.createElement("div");host.className="export-host";host.innerHTML=pagesHtml();document.body.appendChild(host);
  try{
    var imgs=Array.prototype.slice.call(host.querySelectorAll("img"));
    await Promise.all(imgs.map(function(i){return i.complete?1:new Promise(function(r){i.onload=i.onerror=r})}));
    var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"p",compress:true}),first=true;
    var pages=host.querySelectorAll(".pg");
    for(var n=0;n<pages.length;n++){
      var cv=await window.html2canvas(pages[n],{scale:2,backgroundColor:"#ffffff",logging:false});
      var ph=Math.round(cv.width*297/210),y=0;
      while(y<cv.height-2){
        var h=Math.min(ph,cv.height-y),c=cv;
        if(!(y===0&&h===cv.height)){c=document.createElement("canvas");c.width=cv.width;c.height=h;c.getContext("2d").drawImage(cv,0,y,cv.width,h,0,0,cv.width,h)}
        if(!first)pdf.addPage();first=false;
        pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,h*210/cv.width);
        y+=ph;
      }
    }
    return pdf.output("blob");
  }finally{host.remove()}
}
async function makePdf(btn){
  var st=document.getElementById("makest"),res=document.getElementById("result");
  btn.disabled=true;res.innerHTML="";
  st.className="status";st.textContent="Membuat PDF, mohon tunggu sebentar…";
  try{
    var blob=await buildPdf();
    var bln=S.rows.filter(function(r){return r.bulan}).map(function(r){return r.bulan}).join("-");
    resName=("Laporan Posyandu "+S.posyandu.trim()+(bln?" "+bln:"")+".pdf").replace(/[\\\/:*?"<>|]/g," ").replace(/\s+/g," ");
    if(resUrl)URL.revokeObjectURL(resUrl);
    resBlob=blob;resUrl=URL.createObjectURL(blob);
    var canShare=false;
    try{canShare=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[new File([blob],resName,{type:"application/pdf"})]}))}catch(e){}
    res.innerHTML='<div class="result"><strong>PDF siap</strong><div>Simpan file ini lalu cetak.</div><div class="btnrow">'+
      '<a class="btn primary" href="'+resUrl+'" download="'+esc(resName)+'">Simpan PDF</a>'+
      (canShare?'<button type="button" class="btn" id="share">Bagikan atau cetak</button>':'')+
      '<a class="btn" href="'+resUrl+'" target="_blank" rel="noopener">Buka PDF</a></div></div>';
    var sh=document.getElementById("share");
    if(sh)sh.addEventListener("click",function(){navigator.share({files:[new File([resBlob],resName,{type:"application/pdf"})],title:resName}).catch(function(){})});
    st.textContent="";
    res.scrollIntoView({block:"center",behavior:"smooth"});
  }catch(e){
    st.className="status err2";
    st.textContent="PDF belum berhasil dibuat. Periksa sambungan internet, lalu coba lagi. Jika masih gagal, kurangi jumlah foto.";
  }finally{btn.disabled=false}
}

render();
})();
